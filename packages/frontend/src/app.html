<!doctype html>
<html lang="en" data-theme="synthwave">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
			The badge that heads the map, as the tab's mark. Both files are in static/ and
			are the same drawing: favicon.svg is the vector it was made from (glyphs as
			outlines, since a favicon inherits neither the stylesheet nor the webfont), and
			favicon.ico is that rasterised at 16/32/48/64/128/256 with everything outside
			the rounded square transparent.

			`%sveltekit.assets%` rather than a bare `/favicon.ico`: it resolves to whatever
			`paths.base` is, so the link is right at the site root — which is where the
			custom domain in static/CNAME puts this build on GitHub Pages — and stays right
			if it is ever served from a subpath instead. adapter-static copies static/ into
			dist/ as it is, and the Pages workflow uploads that folder whole.
		-->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<!--
			What Discord, WhatsApp and the rest draw when somebody pastes the link. A
			scraper is not a browser: it reads this shell and nothing else — it never runs
			the app, so no route and no `svelte:head` can put a card on the page. That is
			also why there is a plain <title> and <meta name="description"> here at all;
			before this the tab had neither.

			The picture is static/social-card.png, cut from the splash's own first frame —
			the file the <video> below carries as its `poster` — by
			`pnpm --filter @3xl/frontend generate:social-card`. So the picture somebody is
			shown beside the link is the picture they land on: the roster idling over the
			Països Catalans with the badge at its middle. Re-run the script whenever the
			splash is re-captured; do not hand-edit the PNG. The card was a drawing of its
			own until then (a 3:2 plate rasterised from social-card.svg), and that plate is
			not gone — it is the badge hanging inside this picture.

			It is 1200x630 — the box a large card is laid out in everywhere (1.91:1), so
			the picture arrives at the size it is drawn at and no scraper resamples it.
			The splash itself is square (`object-fit: cover` frames the film by the window
			rather than by a ratio, so there is no landscape original), and being larger
			in both directions it is cut on both axes: the crop is centred and the script
			cuts it, the outermost characters are what it costs, and the badge sits where
			it sat.

			og:image:width/height are that size and must be changed with it — a scraper
			reserves the box before the bytes arrive, so a stale pair here is a picture
			that jumps as it loads.

			These URLs are absolute and hardcoded, unlike the icon's `%sveltekit.assets%`:
			a card is fetched by another host, so a root-relative path resolves against
			nothing there. That also means a stale origin here fails *silently and only
			here* — the title and description are text in this file and scrape fine, so
			the card still comes up, just with no picture. Which is exactly what the old
			3xl.bearni.io spelling did.

			The origin is the site's live custom domain, 6xl.bearni.io. Note it is NOT
			what static/CNAME says (that file still reads 3xl.bearni.io, from before the
			rename); the domain Pages actually serves is the one set in the repo's Pages
			settings. Check the live host, not the file, if this ever moves again.

			`twitter:card` stays `summary_large_image`: the picture is landscape and close
			enough to Twitter's 2:1 that little of it is cropped away, while `summary`
			would draw it as a thumbnail beside the text — and a wall of fifty characters
			says nothing at that size.
		-->
		<title>6XL</title>
		<meta name="description" content="El joc d'anime en català" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="6XL" />
		<meta property="og:title" content="6XL" />
		<meta property="og:description" content="El joc d'anime en català" />
		<meta property="og:url" content="https://6xl.bearni.io/" />
		<meta property="og:image" content="https://6xl.bearni.io/social-card.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="El planter de 6XL sobre els Països Catalans" />
		<meta property="og:locale" content="ca_ES" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="6XL" />
		<meta name="twitter:description" content="El joc d'anime en català" />
		<meta name="twitter:image" content="https://6xl.bearni.io/social-card.png" />
		<meta name="twitter:image:alt" content="El planter de 6XL sobre els Països Catalans" />
		<meta name="theme-color" content="#f0b100" />
		<!--
			Umami, self-hosted at umami.bearni.io. It is here rather than in a component
			because it counts visits to the site, not renders of a route: the tag is in
			the shell adapter-static writes once, so it is on the page before the app
			mounts and cannot be unmounted by anything the player opens over the map.
			`defer` keeps it out of the critical path — nothing on screen waits on it,
			and a host that is down costs the game nothing.

			**The tag is only put on the page on the live host.** A development machine does
			not fetch the script, does not run it and does not talk to umami.bearni.io at
			all — there is nothing there to report anything, rather than something loaded
			and asked to stay quiet. So `pnpm dev` on localhost:2000, `pnpm preview` and
			any local build of the bundle are silent by not having a counter.

			That is why this is an inline script writing the tag rather than the plain
			`<script src>` umami hands out: this shell is the *whole* site's document —
			adapter-static writes it once and every path is answered with it — so a literal
			tag here is a tag on every machine that ever opens the bundle. The check is
			`location.hostname` against the one host Pages actually serves, and it is the
			only place that host is spelled: the tracker's own `data-domains` filter would
			be a second spelling of the same string to keep in step, and it only drops the
			*sends* — the script is fetched and run either way. It read `3xl.bearni.io` for
			a while, left behind by the rename, which matched nothing once the game moved:
			the tag loaded on every visit and reported none of them. The host to check is
			the live one, never static/CNAME, which still reads 3xl.

			The tag is built rather than written with document.write, and carries `defer`
			for the same reason the original did — nothing on screen waits on it, and a
			host that is down costs the game nothing. It runs in <head>, before the app
			mounts, so the counter is still on the page ahead of anything the player opens
			over the map and cannot be unmounted by any of it.
		-->
		<script>
			if (location.hostname === '6xl.bearni.io') {
				const umami = document.createElement('script');
				umami.defer = true;
				umami.src = 'https://umami.bearni.io/script.js';
				umami.dataset.websiteId = '3ffa72aa-6e9e-49e5-8940-0f53270b3236';
				document.head.appendChild(umami);
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!--
			The splash, and the reason it is markup in the shell rather than a component.

			This build is a static SPA: until the bundle boots there is no app, no
			stylesheet and no route — a component-drawn splash would first have to wait
			for the very load it is there to cover, and the player would watch a white
			page in the meantime. So the black field and the video are in the document
			adapter-static writes, which is on screen at the first paint and starts
			fetching the video while the bundle is still coming down.

			That is also why every rule here is an inline style and not a Tailwind class:
			app.css is imported by the bundle, so no class in this file would mean
			anything for the whole time this element is the only thing on screen — the
			field is spelled `#000` here for the same reason.

			The video is muted (a browser autoplays nothing else), `playsinline` so iOS
			Safari does not take it fullscreen, and `object-fit: cover` — it is scaled to
			whichever of the viewport's two sides needs it more and cropped on the other,
			so it always fills the screen whatever the window's shape. It carries no
			controls: it is not something to operate.

			`poster` is the video's own first frame, static/../assets/video/splash.png: a
			video paints nothing until it has decoded enough to start, so without it the
			black field stands alone for as long as the fetch takes. The poster is one image
			and arrives long before the mp4, so what the player sees is the film's opening
			frame held still and then moving, rather than a colour and then a cut.

			`SplashScreen.svelte` is what takes it away, 500ms after the app mounts; the
			id is the handle it takes hold of it by. It does not remove it — it moves this
			element under a wrapper of its own and blurs that out, so the film goes rather
			than blinking off. Nothing else here knows about the app, and nothing in the
			app draws this.
		-->
		<div
			id="splash"
			style="position: fixed; inset: 0; z-index: 9999; overflow: hidden; background: #000000"
		>
			<video
				src="%sveltekit.assets%/assets/video/splash.mp4"
				poster="%sveltekit.assets%/assets/video/splash.png"
				style="width: 100%; height: 100%; object-fit: cover"
				autoplay
				loop
				muted
				playsinline
			></video>
		</div>
		<!--
			The splash belongs to the front door and to nothing else. This shell is the
			whole site's document — a static SPA answers every path with it — so the
			markup above would otherwise stand over `/profile` and every other route a
			player lands on or reloads into, which is a title card in front of a page
			nobody arrived at for the first time.

			The check is here, in a synchronous script, rather than in the app: it runs
			while the parser is still in <body>, before the first paint, so off the root
			nothing is ever on screen to flash. Anything the app could do would have to
			wait for the bundle — the very load the splash is covering — and by then the
			player has watched it.

			`paths.base` is empty in this build, so the root is just `/` (or the
			`/index.html` a file-served build lands on). Give this the base too if the
			site ever moves to a subpath.
		-->
		<script>
			if (location.pathname.replace(/index\.html$/, '') !== '/') {
				document.getElementById('splash')?.remove();
			}
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
